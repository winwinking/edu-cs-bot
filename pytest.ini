[pytest]
asyncio_mode = strict
; tests/integration、tests/e2e 里的用例会用到 app.common.db.AsyncSessionLocal、
; app.common.redis.redis_client 这些模块级单例——它们背后的连接池绑定在"第一次被用到时
; 那个事件循环"上。pytest-asyncio 默认每个测试函数各开一个新事件循环（function 级），
; 第二个测试一用这些单例就会报"attached to a different loop"。改成 session 级：整次
; pytest 运行只用一个事件循环，跟 scripts/phase2_smoke.py 等冒烟脚本"一个 asyncio.run()
; 跑到底"是同一个思路。tests/unit 不连真实 DB/Redis（该 mock 的地方都用假对象替掉了），
; 换成 session 级对它们没有影响。
asyncio_default_test_loop_scope = session
