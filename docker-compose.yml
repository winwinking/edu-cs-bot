name: edu-cs-bot

# gateway / worker / scheduler 共用同一个镜像，用 YAML anchor 避免每个服务都抄一遍。
# target: base 显式指定构建到 docker/app.Dockerfile 的 base 阶段（不含 pytest 等测试工具，
# 阶段四 4.2 审查修复）——tools 服务需要 tools 阶段、镜像名也不同，不复用这个锚点，见下面
# tools 服务自己的 image/build
x-app-build: &app-build
  image: edu-cs-bot/app:latest
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: base

x-app-healthcheck: &app-healthcheck
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 5s
    timeout: 5s
    retries: 10

# 5 个 mock 服务共用同一个镜像和健康检查方式，用 YAML anchor 避免每个服务都抄一遍。
# target: base 同上，不含测试工具；mocks-tools 服务不复用这个锚点，见它自己的 image/build
x-mocks-build: &mocks-build
  image: edu-cs-bot/mocks:latest
  build:
    context: .
    dockerfile: docker/mocks.Dockerfile
    target: base
  restart: unless-stopped

x-mocks-healthcheck: &mocks-healthcheck
  healthcheck:
    # 镜像里没装 curl，用 python 自带的 urllib 探活，不用额外装东西
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 5s
    timeout: 5s
    retries: 10

# gateway / worker / scheduler 在后续步骤加入
services:
  # 一次性任务用的容器：迁移、种子数据这类活不需要一直跑着，跟 gateway/worker/scheduler 共用同一个镜像
  # profiles 让它不随 make up 启动，只有 docker compose run 显式叫它的时候才会起来，干完活就退出
  # 一次性任务用的容器：迁移、种子数据、跑 tests/unit+integration+e2e 这类活不需要一直跑着。
  # 阶段四 4.2 审查修复：不复用 x-app-build 这个锚点（那个锚点指向 base 阶段，没有 pytest），
  # 单独给自己的 image 名（edu-cs-bot/app-tools:latest）+ build.target: tools——这样它跟
  # gateway/worker/scheduler 用的 edu-cs-bot/app:latest 是两个完全独立的镜像，不会因为构建
  # 顺序不同而互相覆盖谁有没有测试工具。
  tools:
    image: edu-cs-bot/app-tools:latest
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: tools
    profiles: ["tools"]
    env_file:
      - .env
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
      # 测试代码不进镜像（app.Dockerfile 的 tools 阶段也不 COPY tests/），靠挂载在运行时
      # 拿到测试代码，只读即可
      - ./tests:/app/tests:ro
      # 阶段四 4.6：loadtest/gen_users.py 要写 loadtest/tokens.json（压测用户 token，
      # 见 .gitignore），跟 tests/ 一样不 COPY 进镜像，但这个要能写回宿主机，不能是只读挂载
      - ./loadtest:/app/loadtest
      # 阶段五 5.4：eval/run_eval.py 要把每题明细写到 eval/output/（见 .gitignore，不进
      # git），同样不 COPY 进镜像、挂载读写，改 cases.jsonl/SCORING.md 不需要重新 build tools
      - ./eval:/app/eval
    depends_on:
      postgres:
        condition: service_healthy

  # 阶段四 4.2：跑 tests/unit/test_mock_llm_rules.py 专用的一次性容器——这个测试要 import
  # mocks.mock_llm.rules，只有 mocks 镜像里有这个包，tools（app 镜像）没有，所以不能复用 tools；
  # 又不能像以前那样直接 `docker compose run --rm mock-llm pytest ...`，因为常驻的 mock-llm
  # 服务现在用的是不含测试工具的 base 阶段。这里单独给自己的 image 名
  # （edu-cs-bot/mocks-tools:latest）+ build.target: tools，理由跟上面 tools 服务一样。
  mocks-tools:
    image: edu-cs-bot/mocks-tools:latest
    build:
      context: .
      dockerfile: docker/mocks.Dockerfile
      target: tools
    profiles: ["tools"]
    # 一次性容器，不需要也不应该像 mock-llm 等常驻服务那样意外重启
    restart: "no"
    volumes:
      - ./tests:/app/tests:ro

  gateway:
    <<: [*app-build, *app-healthcheck]
    command: ["python", "-m", "app.gateway.main"]
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GATEWAY_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    <<: *app-build
    command: ["python", "-m", "app.worker.main"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
    # 端口写成一个范围（不是单个固定端口），跟 scheduler 是同一个理由：`docker compose up -d
    # --scale worker=N` 要求每个副本都能拿到一个不冲突的宿主机端口，固定映射会让第二个副本
    # 起不来。单实例时依然稳定拿到 WORKER_HEALTH_HOST_PORT（默认 8011）
    ports:
      - "${WORKER_HEALTH_HOST_PORT}-8019:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-llm:
        condition: service_healthy

  scheduler:
    <<: *app-build
    command: ["python", "-m", "app.scheduler.main"]
    restart: unless-stopped
    env_file:
      - .env
    # 端口写成一个范围（不是单个固定端口）：PHASE3.md 要求验证"多个 scheduler 不重复处理同一条
    # 提醒"，需要 `docker compose up -d --scale scheduler=2` 真的能起第二个实例——固定端口映射
    # 会导致第二个副本抢占同一个宿主机端口而启动失败。单实例时依然稳定拿到
    # SCHEDULER_HEALTH_HOST_PORT 这个端口（compose 按顺序从范围里分配），只有扩容时才会用到
    # 范围里更靠后的端口
    ports:
      - "${SCHEDULER_HEALTH_HOST_PORT}-8009:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 开 appendonly 保证 Redis 重启后去重 key、发布订阅相关状态不会突然丢失
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-llm:
    <<: [*mocks-build, *mocks-healthcheck]
    command: ["python", "-m", "mocks.mock_llm.main"]
    environment:
      MOCK_LLM_LATENCY_MS: ${MOCK_LLM_LATENCY_MS}
      MOCK_LLM_ERROR_RATE: ${MOCK_LLM_ERROR_RATE}
      MOCK_LLM_MODE: ${MOCK_LLM_MODE}
    ports:
      - "${MOCK_LLM_HOST_PORT}:8000"

  mock-im:
    <<: [*mocks-build, *mocks-healthcheck]
    command: ["python", "-m", "mocks.mock_im.main"]
    # 阶段三第 7 步：mock-im 变成演示控制台，身份切换要按 tenant_id+user_id 查真实角色、
    # 用开发签发方式现场发 token（不能让前端自己拼），所以要跟 gateway 一样连数据库、读 JWT 密钥
    env_file:
      - .env
    environment:
      # 浏览器直接连 gateway 的 WebSocket，这里要传宿主机映射端口，不是容器内部端口
      GATEWAY_HOST_PORT: ${GATEWAY_HOST_PORT}
    ports:
      - "${MOCK_IM_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mock-knowledge:
    <<: [*mocks-build, *mocks-healthcheck]
    command: ["python", "-m", "mocks.mock_knowledge.main"]
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
    ports:
      - "${MOCK_KNOWLEDGE_HOST_PORT}:8000"

  mock-platform:
    <<: [*mocks-build, *mocks-healthcheck]
    command: ["python", "-m", "mocks.mock_platform.main"]
    environment:
      MOCK_PLATFORM_LATENCY_MS: ${MOCK_PLATFORM_LATENCY_MS}
      MOCK_PLATFORM_MODE: ${MOCK_PLATFORM_MODE}
    ports:
      - "${MOCK_PLATFORM_HOST_PORT}:8000"

  mock-finance:
    <<: [*mocks-build, *mocks-healthcheck]
    command: ["python", "-m", "mocks.mock_finance.main"]
    environment:
      FINANCE_SERVICE_TOKEN: ${FINANCE_SERVICE_TOKEN}
      MOCK_FINANCE_LATENCY_MS: ${MOCK_FINANCE_LATENCY_MS}
      MOCK_FINANCE_MODE: ${MOCK_FINANCE_MODE}
    ports:
      - "${MOCK_FINANCE_HOST_PORT}:8000"

  # 阶段四 4.6，关键设计决定 6：压测用官方 k6 镜像，单独一个 profile（"loadtest"），不带
  # profiles 的 `make up`/`docker compose up` 不会启动它；`docker compose run --rm k6 run
  # xxx.js` 才会临时起一个容器跑完就退出，跟 tools/mocks-tools 是同一个"一次性容器"套路。
  # k6 直接用 docker 网络内部地址连 gateway/RabbitMQ 管理接口，不需要额外开端口给宿主机。
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    working_dir: /loadtest
    volumes:
      - ./loadtest:/loadtest
    environment:
      GATEWAY_WS_URL: ws://gateway:8000/ws
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
